[package]
name = "clock-iced"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced"] }
iced_core = { version = "0.14", features = ["serde"] } # needed for Config
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "local-time"] }
regex = "1"

axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
reqwest = { version = "0.13" }
nix = { version = "0", features = ["process", "reboot"] }
linemux = "0.3.0"
tokio-stream = "0"
notify = "8"