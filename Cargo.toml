[package]
name = "bedstand"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "tokio", "advanced"] }
tokio = { version = "1", default-features = false, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0", default-features = false, features = ["sync"] }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde"] }
humantime-serde = "1"

tracing = "0"
tracing-subscriber = { version = "0", default-features = false, features = ["ansi", "env-filter", "fmt"] }
regex = "1"

axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

nix = { version = "0", default-features = false, features = ["process", "reboot"] }
linemux = "0.3.0"
notify = "8"